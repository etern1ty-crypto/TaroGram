name: Build TaroGram (Standalone)

on:
  push:
    branches:
      - tarogram-base
      - 'devin/**'
      - 'feature/**'
  pull_request:
    branches:
      - tarogram-base
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        required: true
        default: debug
        options:
          - debug
          - standalone

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: 21.4.7075529
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -e
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache NDK objects
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
            TMessagesProj_AppStandalone/.cxx
          key: ndk-objects-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/CMakeLists.txt') }}
          restore-keys: ndk-objects-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}-

      - name: Generate debug keystore
        run: |
          set -e
          KEY=Your_Key.jks
          if [ ! -f "$KEY" ]; then
            keytool -genkey -v -keystore "$KEY" \
              -storepass Your_Password -keypass Your_Password \
              -alias Your_Alias -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TaroGram CI, OU=Dev, O=etern1ty-crypto, L=NA, S=NA, C=US"
          fi
          keytool -list -v -keystore "$KEY" -storepass Your_Password \
            | grep -E 'Alias|Owner|SHA256' | head -10

      - name: Inject Telegram API credentials (placeholder if no secrets set)
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          set -e
          EXTRA=TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          APP_ID="${TELEGRAM_APP_ID:-4}"          # Telegram open-source test creds
          APP_HASH="${TELEGRAM_APP_HASH:-014b35b6184100b085b0d0572f9b5103}"
          sed -i -E "s|const val APP_ID = [0-9]+|const val APP_ID = $APP_ID|" "$EXTRA"
          sed -i -E "s|const val APP_HASH = \"[^\"]*\"|const val APP_HASH = \"$APP_HASH\"|" "$EXTRA"
          echo "Patched Extra.kt:"
          grep -E "APP_ID|APP_HASH" "$EXTRA" | head -2

      # NOTE: We intentionally do NOT disable the Crashlytics Gradle plugin.
      # The previous workflow commented out `apply plugin: 'com.google.firebase.crashlytics'`,
      # which broke the app at startup with:
      #   IllegalStateException: The Crashlytics build ID is missing.
      # The plugin generates a build-id properties file that FirebaseInitProvider
      # reads at runtime. Cherrygram ships a real google-services.json so the
      # plugin runs fine without our intervention. The plugin will still try to
      # upload mappings for *release* builds, but debug builds skip mapping/symbol
      # upload because R8/minify is disabled.

      - name: Build Standalone APK (afatStandalone${{ env.BUILD_TYPE == 'debug' && 'Debug' || 'Release' }})
        run: |
          set -e
          chmod +x ./gradlew
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace
          else
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced!"
            find TMessagesProj_AppStandalone/build -type f -name '*.apk' || true
            exit 1
          fi
          NAME=TaroGram-${GITHUB_SHA:0:7}-${BUILD_TYPE}.apk
          cp "$APK" "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Attach APK to release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
